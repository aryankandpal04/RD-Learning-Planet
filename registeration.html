      <h1 class="text-2xl sm:text-3xl md:text-5xl font-extrabold text-cyan-300 animate__animated animate__fadeInUp text-center">RD LEARNING PLANET</h1>
      <h3 class="text-orange-400 italic mt-2 animate__animated animate__fadeInUp animate__delay-1s text-center text-sm sm:text-base">(AN INVESTMENT IN KNOWLEDGE PAYS THE BEST INTEREST)</h3>
    </div>

  <!-- Registration Form Section -->
  <section class="py-6 px-4 md:py-10 md:px-4 max-w-md md:max-w-3xl mx-auto mb-6 md:mb-12" data-aos="fade-up" data-aos-duration="600">
    <div class="bg-[#1e293b] text-white rounded-xl shadow-lg p-4 md:p-8">
      <h2 class="text-xl sm:text-2xl md:text-3xl font-bold text-center text-cyan-300 mb-4 md:mb-6">Registration Form</h2>
      <form id="registration-form" method="post" class="space-y-3 md:space-y-4">
        <div>
          <label for="username" class="block mb-1 font-semibold text-sm md:text-base">Student Name</label>
          <input type="text" name="username" id="username" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Enter student name" />
        </div>
        <div>
          <label for="guardianname" class="block mb-1 font-semibold text-sm md:text-base">Parent/Guardian's Name</label>
          <input type="text" name="guardianname" id="guardianname" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Enter parent/guardian's name" />
        </div>
        <div>
          <label for="address" class="block mb-1 font-semibold text-sm md:text-base">Address</label>
          <textarea name="address" id="address" rows="3" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Enter address"></textarea>
        </div>
        <div>
          <label for="schoolname" class="block mb-1 font-semibold text-sm md:text-base">School/College Name</label>
          <input type="text" name="schoolname" id="schoolname" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Enter school or college name" />
        </div>
        <div>
          <label for="contactno" class="block mb-1 font-semibold text-sm md:text-base">Contact Number</label>
          <input type="tel" name="contactno" id="contactno" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="10-digit student mobile number" />
        </div>
        <div>
          <label for="parent_contactno" class="block mb-1 font-semibold text-sm md:text-base">Parent/Guardian's Contact Number</label>
          <input type="tel" name="parent_contactno" id="parent_contactno" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="10-digit parent/guardian mobile number" />
        </div>
        <div>
          <label for="class" class="block mb-1 font-semibold text-sm md:text-base">Class/Course</label>
          <select name="class" id="class" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white focus:outline-none focus:ring-2 focus:ring-cyan-400">
            <option value="" selected disabled>Select Class/Course</option>
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
            <option value="5">5th</option>
            <option value="6">6th</option>
            <option value="7">7th</option>
            <option value="8">8th</option>
            <option value="9">9th</option>
            <option value="10">10th</option>
            <option value="11">11th</option>
            <option value="12">12th</option>
            <option value="BCA/BSc mathematics">BCA/BSc mathematics</option>
            <option value="BSc CS/IT">BSc CS/IT</option>
            <option value="BBA">BBA</option>
            <option value="B.Pharma">B.Pharma</option>
          </select>
        </div>
        <div class="checkboxes" id="subjectCheckboxes" style="display: none">
          <span class="block mb-1 font-semibold text-sm md:text-base">Subjects</span>
          <label id="allSubjectsLabel" style="display: none"><input type="checkbox" name="all_subjects" value="All Subjects" class="mr-2" /> All Subjects</label>
          <label id="mathLabel" style="display: none"><input type="checkbox" name="math" value="Maths" class="mr-2" /> Maths</label>
          <label id="scienceLabel" style="display: none"><input type="checkbox" name="science" value="Science" class="mr-2" /> Science</label>
          <label id="physicsLabel" style="display: none"><input type="checkbox" name="physics" value="Physics" class="mr-2" /> Physics</label>
          <label id="chemistryLabel" style="display: none"><input type="checkbox" name="chemistry" value="Chemistry" class="mr-2" /> Chemistry</label>
          <label id="bioLabel" style="display: none"><input type="checkbox" name="biology" value="Biology" class="mr-2" /> Biology</label>
          <label id="economicsLabel" style="display: none"><input type="checkbox" name="economics" value="Economics" class="mr-2" /> Economics</label>
        </div>
        <div id="otherSection" style="display: none">
          <label class="block mb-2"><input type="checkbox" id="sainikCheckbox" name="sainik" value="sainik" class="mr-2" /> Preparation for Sainik School Exam</label>
          <label class="block mb-2"><input type="checkbox" id="navodayaCheckbox" name="navodaya" value="navodaya" class="mr-2" /> Preparation for Navodaya Vidyalaya Exam</label>
        </div>
        <div>
          <label for="medium" class="block mb-1 font-semibold text-sm md:text-base">Medium of Instruction</label>
          <select name="medium" id="medium" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white focus:outline-none focus:ring-2 focus:ring-cyan-400">
            <option value="" selected disabled>Select Medium</option>
            <option value="Hindi">Hindi</option>
            <option value="English">English</option>
          </select>
        </div>
        <div>
          <label for="board" class="block mb-1 font-semibold text-sm md:text-base">Board</label>
          <select name="board" id="board" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white focus:outline-none focus:ring-2 focus:ring-cyan-400">
            <option value="" selected disabled>Select Board</option>
            <option value="CBSE">CBSE</option>
            <option value="UK Board">UK Board</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div id="otherBoardDiv" style="display: none;">
          <label for="otherBoard" class="block mb-1 font-semibold text-sm md:text-base">Please specify your Board</label>
          <input type="text" name="otherBoard" id="otherBoard" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Enter your board name" />
        </div>
        <div>
          <label for="photo" class="block mb-1 font-semibold text-sm md:text-base">Student Photo Upload</label>
          <input type="file" name="photo" id="photo" accept="image/*" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white file:bg-cyan-400 file:text-[#0f172a] file:rounded file:font-bold file:px-4 file:py-2 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
        </div>
        <div>
          <label for="parent_email" class="block mb-1 font-semibold text-sm md:text-base">Parent/Guardian Email <span class="text-gray-400 text-xs">(Optional)</span></label>
          <input type="email" name="parent_email" id="parent_email" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Enter parent/guardian email (optional)" />
        </div>
        <div>
          <label for="date" class="block mb-1 font-semibold text-sm md:text-base">Joining Date</label>
          <input type="date" name="date" id="date" class="w-full border rounded px-3 py-2 text-sm md:text-base bg-[#0f172a] text-white focus:outline-none focus:ring-2 focus:ring-cyan-400" />
        </div>
        <div>
          <span class="block mb-1 font-semibold text-sm md:text-base mt-2">Gender</span>
          <div class="flex items-center gap-6 mt-1">
            <label class="inline-flex items-center"><input type="radio" id="male" name="gender" value="male" class="mr-2" /> Male</label>
            <label class="inline-flex items-center"><input type="radio" id="female" name="gender" value="female" class="mr-2" /> Female</label>
          </div>
        </div>
        <div class="mt-6 flex gap-4 justify-center">
          <input type="submit" name="submit" value="Submit" class="bg-orange-500 hover:bg-orange-600 text-white py-2 px-6 rounded font-bold focus:outline-none focus:ring-2 focus:ring-orange-300 transition-all duration-300 hover:scale-105 hover:shadow-lg cursor-pointer" />
          <input type="reset" name="reset" value="Reset" class="bg-cyan-400 hover:bg-cyan-500 text-[#0f172a] py-2 px-6 rounded font-bold focus:outline-none focus:ring-2 focus:ring-cyan-300 transition-all duration-300 hover:scale-105 hover:shadow-lg cursor-pointer" />
        </div>
      </form>
    </div>
  </section>
